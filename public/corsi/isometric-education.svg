<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sfondo con gradiente blu VeryPosta -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3a6b" />
      <stop offset="100%" stop-color="#2a4e8d" />
    </linearGradient>
  </defs>
  
  <!-- Griglia isometrica -->
  <g transform="translate(200, 150)">
    <!-- Piattaforma base -->
    <g transform="skewX(-30) scale(1, 0.866)">
      <rect x="-100" y="-20" width="200" height="100" fill="#ebd00b" rx="4" ry="4" />
      <rect x="-90" y="-10" width="180" height="80" fill="#f5e575" rx="2" ry="2" />
    </g>
    
    <!-- Libro 3D -->
    <g transform="translate(-50, -40) skewX(-30) scale(0.8, 0.7)">
      <!-- Copertina -->
      <rect x="-30" y="-20" width="60" height="80" fill="#1d3a6b" rx="2" ry="2" />
      <!-- Pagine -->
      <rect x="-25" y="-15" width="50" height="70" fill="#ffffff" />
      <!-- Dettagli -->
      <rect x="-20" y="-5" width="40" height="2" fill="#2a4e8d" />
      <rect x="-20" y="2" width="40" height="2" fill="#2a4e8d" />
      <rect x="-20" y="9" width="40" height="2" fill="#2a4e8d" />
      <rect x="-20" y="16" width="30" height="2" fill="#2a4e8d" />
    </g>
    
    <!-- Laptop 3D -->
    <g transform="translate(30, -30) rotate(-10)">
      <!-- Base -->
      <rect x="-25" y="10" width="50" height="35" fill="#2a4e8d" rx="2" ry="2" />
      <!-- Schermo -->
      <g transform="rotate(-75, 0, 10)">
        <rect x="-25" y="-25" width="50" height="35" fill="#1d3a6b" rx="2" ry="2" />
        <rect x="-22" y="-22" width="44" height="29" fill="#f5f5f7" rx="1" ry="1" />
        <!-- Contenuto schermo -->
        <rect x="-18" y="-18" width="36" height="4" fill="#ebd00b" rx="1" ry="1" />
        <rect x="-18" y="-12" width="20" height="3" fill="#1d3a6b" rx="1" ry="1" />
        <rect x="-18" y="-7" width="30" height="2" fill="#1d3a6b" rx="1" ry="1" />
        <rect x="-18" y="-3" width="25" height="2" fill="#1d3a6b" rx="1" ry="1" />
        <rect x="-18" y="1" width="28" height="2" fill="#1d3a6b" rx="1" ry="1" />
      </g>
    </g>
    
    <!-- Certificato -->
    <g transform="translate(-10, -60) rotate(15) skewX(-15) scale(0.7, 0.7)">
      <rect x="-30" y="-20" width="60" height="40" fill="#ffffff" stroke="#ebd00b" stroke-width="3" />
      <rect x="-20" y="-10" width="40" height="4" fill="#1d3a6b" rx="1" ry="1" />
      <rect x="-15" y="0" width="30" height="3" fill="#1d3a6b" rx="1" ry="1" />
      <rect x="-10" y="8" width="20" height="3" fill="#1d3a6b" rx="1" ry="1" />
      <circle cx="0" cy="25" r="10" fill="#ebd00b" />
    </g>
    
    <!-- Icona quiz -->
    <g transform="translate(60, -50) rotate(5)">
      <circle cx="0" cy="0" r="15" fill="#ebd00b" />
      <text x="0" y="5" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1d3a6b">?</text>
    </g>
  </g>
</svg>