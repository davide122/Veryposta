<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f0f4f8"/>
  <g transform="translate(100, 50)">
    <!-- Document Stack -->
    <rect x="10" y="20" width="180" height="160" rx="5" fill="white" stroke="#1d3a6b" stroke-width="2"/>
    <rect x="5" y="10" width="180" height="160" rx="5" fill="white" stroke="#1d3a6b" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="160" rx="5" fill="white" stroke="#1d3a6b" stroke-width="2"/>
    
    <!-- Document Content -->
    <line x1="20" y1="30" x2="160" y2="30" stroke="#1d3a6b" stroke-width="1"/>
    <line x1="20" y1="45" x2="160" y2="45" stroke="#1d3a6b" stroke-width="1"/>
    <line x1="20" y1="60" x2="160" y2="60" stroke="#1d3a6b" stroke-width="1"/>
    <line x1="20" y1="75" x2="100" y2="75" stroke="#1d3a6b" stroke-width="1"/>
    
    <!-- Signature Area -->
    <line x1="110" y1="120" x2="160" y2="120" stroke="#1d3a6b" stroke-width="1"/>
    <path d="M 115,115 Q 125,105 130,115 Q 135,125 140,115 Q 145,105 150,115 Q 155,125 160,115" stroke="#ebd00b" stroke-width="2" fill="none"/>
    
    <!-- Stamp -->
    <circle cx="50" cy="110" r="20" fill="none" stroke="#ebd00b" stroke-width="2" stroke-dasharray="2"/>
    <text x="50" y="115" text-anchor="middle" font-family="Arial" font-size="6" fill="#1d3a6b">VERYPOSTA</text>
    
    <!-- Pen -->
    <g transform="translate(-40, 80) rotate(-45)">
      <rect x="0" y="0" width="60" height="10" rx="5" fill="#1d3a6b"/>
      <path d="M 60,0 L 70,5 L 60,10 Z" fill="#1d3a6b"/>
      <rect x="5" y="3" width="10" height="4" fill="#ebd00b"/>
    </g>
    
    <!-- Clipboard -->
    <g transform="translate(-60, 20)">
      <rect x="0" y="0" width="40" height="50" rx="2" fill="#ebd00b" opacity="0.8"/>
      <rect x="5" y="10" width="30" height="35" fill="white"/>
      <line x1="10" y1="20" x2="30" y2="20" stroke="#1d3a6b" stroke-width="1"/>
      <line x1="10" y1="30" x2="30" y2="30" stroke="#1d3a6b" stroke-width="1"/>
      <line x1="10" y1="40" x2="20" y2="40" stroke="#1d3a6b" stroke-width="1"/>
      <circle cx="20" cy="5" r="3" fill="#1d3a6b"/>
    </g>
  </g>
</svg>