<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f0f4f8"/>
  <g transform="translate(100, 60)">
    <!-- Box -->
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#1d3a6b"/>
    <rect x="10" y="10" width="180" height="130" rx="5" fill="white" stroke="#ebd00b" stroke-width="2"/>
    
    <!-- Address and Stamps -->
    <rect x="20" y="30" width="100" height="60" fill="#f0f4f8"/>
    <rect x="130" y="30" width="50" height="60" fill="#ebd00b" opacity="0.8"/>
    
    <!-- Barcode -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="160" height="30" fill="white"/>
      <line x1="10" y1="5" x2="10" y2="25" stroke="#1d3a6b" stroke-width="2"/>
      <line x1="15" y1="5" x2="15" y2="25" stroke="#1d3a6b" stroke-width="1"/>
      <line x1="25" y1="5" x2="25" y2="25" stroke="#1d3a6b" stroke-width="3"/>
      <line x1="35" y1="5" x2="35" y2="25" stroke="#1d3a6b" stroke-width="2"/>
      <line x1="45" y1="5" x2="45" y2="25" stroke="#1d3a6b" stroke-width="1"/>
      <line x1="55" y1="5" x2="55" y2="25" stroke="#1d3a6b" stroke-width="3"/>
      <line x1="65" y1="5" x2="65" y2="25" stroke="#1d3a6b" stroke-width="1"/>
      <line x1="75" y1="5" x2="75" y2="25" stroke="#1d3a6b" stroke-width="2"/>
      <line x1="85" y1="5" x2="85" y2="25" stroke="#1d3a6b" stroke-width="3"/>
      <line x1="95" y1="5" x2="95" y2="25" stroke="#1d3a6b" stroke-width="1"/>
      <line x1="105" y1="5" x2="105" y2="25" stroke="#1d3a6b" stroke-width="2"/>
      <line x1="115" y1="5" x2="115" y2="25" stroke="#1d3a6b" stroke-width="1"/>
      <line x1="125" y1="5" x2="125" y2="25" stroke="#1d3a6b" stroke-width="3"/>
      <line x1="135" y1="5" x2="135" y2="25" stroke="#1d3a6b" stroke-width="2"/>
      <line x1="145" y1="5" x2="145" y2="25" stroke="#1d3a6b" stroke-width="1"/>
    </g>
    
    <!-- Globe Icon -->
    <circle cx="-50" cy="75" r="40" fill="#ebd00b" opacity="0.6"/>
    <circle cx="-50" cy="75" r="30" fill="none" stroke="#1d3a6b" stroke-width="2"/>
    <path d="M -80,75 L -20,75 M -50,45 L -50,105" stroke="#1d3a6b" stroke-width="2"/>
    <path d="M -70,55 Q -50,35 -30,55" stroke="#1d3a6b" stroke-width="2" fill="none"/>
    <path d="M -70,95 Q -50,115 -30,95" stroke="#1d3a6b" stroke-width="2" fill="none"/>
  </g>
</svg>